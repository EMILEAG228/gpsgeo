<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>⚡ GPS ↔ UTM Pro - CEET v2</title>
  <link rel="icon" href="https://services.ceet.tg/assets/img/ceet_logo1.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

  <!-- Libs -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --primary: #00f2ff;
      --secondary: #7000ff;
      --accent: #ff0080;
      --bg: #050810;
      --card-bg: rgba(15, 20, 35, 0.75);
      --glass-border: rgba(0, 242, 255, 0.25);
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --success: #00ff88;
      --error: #ff3d00;
    }

    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Canvas Fond + Globe */
    #bgCanvas, #globeCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -2;
    }
    
    #globeCanvas {
      z-index: -1;
      opacity: 0;
      pointer-events: none;
    }

    /* Scanlines HUD */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 9999;
    }

    header {
      width: 100%;
      padding: 16px 24px;
      background: rgba(5, 8, 16, 0.85);
      backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      font-weight: 900;
      background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 3s linear infinite;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    @keyframes gradientShift {
      to { background-position: 200% center; }
    }

    .header-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 242, 255, 0.05);
      border-radius: 10px;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.3s;
    }

    .icon-btn:hover {
      background: var(--primary);
      color: var(--bg);
      transform: translateY(-2px) rotate(5deg);
      box-shadow: 0 5px 20px rgba(0, 242, 255, 0.4);
    }

    .status-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .container {
      max-width: 1200px;
      width: 95%;
      margin: 40px auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      perspective: 2000px;
    }

    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.6), 
        0 0 40px rgba(0, 242, 255, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transform-style: preserve-3d;
      will-change: transform;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      padding: 1px;
      background: linear-gradient(135deg, var(--primary), transparent, var(--secondary));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .glass-card:hover::before { opacity: 1; }

    h1, h2 {
      font-family: 'Orbitron', sans-serif;
      color: var(--primary);
      text-transform: uppercase;
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-shadow: 0 0 20px rgba(0, 242, 255, 0.5);
    }

    h1::before, h2::before {
      content: '';
      width: 4px;
      height: 24px;
      background: linear-gradient(180deg, var(--primary), var(--secondary));
      border-radius: 2px;
      box-shadow: 0 0 10px var(--primary);
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    input, select {
      width: 100%;
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      font-family: 'Rajdhani', sans-serif;
      transition: all 0.3s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 20px rgba(0, 242, 255, 0.3), inset 0 0 10px rgba(0, 242, 255, 0.1);
      background: rgba(0, 242, 255, 0.08);
      transform: translateY(-1px);
    }

    .btn-main {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      color: white;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 8px 25px rgba(112, 0, 255, 0.5);
      position: relative;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .btn-main::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 0; height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn-main:hover::before {
      width: 300px; height: 300px;
    }

    .btn-main:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(0, 242, 255, 0.6);
    }

    .btn-main:active { transform: translateY(-1px); }

    .btn-main:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 12px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s;
      text-decoration: none;
      text-align: center;
    }

    .btn-secondary:hover {
      background: var(--primary);
      color: var(--bg);
      box-shadow: 0 0 20px rgba(0, 242, 255, 0.5);
      transform: translateY(-2px);
    }

    .result-box {
      margin-top: 24px;
      padding: 20px;
      background: rgba(0, 242, 255, 0.05);
      border-left: 3px solid var(--primary);
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.8;
      display: none;
      position: relative;
      overflow: hidden;
    }

    .result-box::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 242, 255, 0.2), transparent);
      animation: scanline 2s linear infinite;
    }

    @keyframes scanline {
      to { left: 100%; }
    }

    .result-box strong {
      color: var(--primary);
      font-family: 'Orbitron', sans-serif;
    }

    #map {
      width: 100%;
      height: 400px;
      margin-top: 24px;
      border-radius: 18px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .leaflet-tile {
      filter: hue-rotate(200deg) saturate(0.3) brightness(0.4) contrast(1.2);
    }

    /* Compass 3D */
    #compass {
      width: 80px;
      height: 80px;
      border: 2px solid var(--primary);
      border-radius: 50%;
      position: relative;
      margin: 20px auto;
      background: radial-gradient(circle, rgba(0,242,255,0.1), transparent);
      box-shadow: 0 0 20px rgba(0, 242, 255, 0.3), inset 0 0 20px rgba(0, 242, 255, 0.1);
    }

    #compass::before {
      content: 'N';
      position: absolute;
      top: 5px; left: 50%;
      transform: translateX(-50%);
      color: var(--accent);
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
    }

    #compass-needle {
      position: absolute;
      top: 50%; left: 50%;
      width: 2px; height: 35px;
      background: linear-gradient(180deg, var(--accent), var(--primary));
      transform-origin: bottom center;
      transform: translate(-50%, -100%);
      box-shadow: 0 0 10px var(--accent);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px; right: 30px;
      padding: 16px 24px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-left: 4px solid var(--primary);
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      z-index: 10000;
      transform: translateX(400px);
      font-family: 'Rajdhani', sans-serif;
    }

    .toast.error { border-left-color: var(--error); }
    .toast.success { border-left-color: var(--success); }

    /* History */
    #history {
      max-height: 200px;
      overflow-y: auto;
      margin-top: 16px;
    }

    .history-item {
      padding: 12px;
      margin-bottom: 8px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .history-item:hover {
      background: rgba(0, 242, 255, 0.1);
      border-color: var(--primary);
      transform: translateX(5px);
    }

    /* Accuracy Circle */
    .accuracy-circle {
      animation: accuracyPulse 2s ease-in-out infinite;
    }

    @keyframes accuracyPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    /* Radar Pulse */
    @keyframes radarPulse {
      0% {
        transform: scale(0);
        opacity: 1;
      }
      100% {
        transform: scale(4);
        opacity: 0;
      }
    }

    .grid-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) {
      .grid-inputs, .btn-group { grid-template-columns: 1fr; }
      .container { padding: 0 12px; }
      .glass-card { padding: 20px; }
    }

    /* Loader */
    .loader {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      margin-top: 60px;
      padding: 40px 20px;
      text-align: center;
      width: 100%;
      border-top: 1px solid var(--glass-border);
    }

    .logo-spin {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      padding: 8px;
      animation: spin 10s linear infinite;
      margin-bottom: 20px;
      box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <canvas id="globeCanvas"></canvas>

  <header>
    <div class="logo-text">⚡ GPS ↔ UTM PRO v2</div>
    <div class="header-controls">
      <div class="icon-btn" id="toggleGlobe" title="Vue 3D Globe">🌍</div>
      <div class="icon-btn" id="toggleTheme" title="Thème">🌙</div>
      <div class="status-led"></div>
    </div>
  </header>

  <div class="container">
    <!-- Card 1: GPS -->
    <div class="glass-card">
      <h1>🛰️ Géolocalisation Temps Réel</h1>
      <div id="compass">
        <div id="compass-needle"></div>
      </div>
      <button class="btn-main" id="btnLocation">
        <span>Scanner ma Position</span>
      </button>
      <div class="btn-group">
        <button class="btn-secondary" id="btnWatch">📍 Suivi Live</button>
        <button class="btn-secondary" id="btnExport">💾 Export KML</button>
      </div>
      <div id="result" class="result-box"></div>
      <div id="map"></div>
      <h2 style="margin-top: 24px; font-size: 1rem;">📜 Historique</h2>

    </div>

    <!-- Card 2: UTM -->
    <div class="glass-card">
      <h1>🧭 Conversion UTM Avancée</h1>
      <div class="input-group">
        <label>Zone UTM Auto</label>
        <select id="utmZone">
          <option value="auto">Détection Auto</option>
          <option value="31N">Zone 31N - Togo/Bénin</option>
          <option value="30N">Zone 30N - Ghana</option>
          <option value="32N">Zone 32N - Nigeria</option>
        </select>
      </div>
      <div class="grid-inputs">
        <div class="input-group">
          <label>Easting (X)</label>
          <input type="number" id="easting" placeholder="Ex: 293281" step="0.01">
        </div>
        <div class="input-group">
          <label>Northing (Y)</label>
          <input type="number" id="northing" placeholder="Ex: 686252" step="0.01">
        </div>
      <button class="btn-main" id="btnConvert">
        <span>Convertir en Lat/Lon</span>
      </button>
      <div class="btn-group">
        <button class="btn-secondary" id="btnDrawArc">📐 Tracer Arc</button>
        <button class="btn-secondary" id="btnGridUTM">🔲 Grille UTM</button>
      </div>
      <div id="utmResult" class="result-box"></div>
      <div style="margin-top: 24px;">
        <a href="index.html" class="btn-secondary" style="display: block; margin-bottom: 8px;">🏠 Menu Principal</a>
        <a href="converter.html" class="btn-secondary" style="display: block;">⚙️ Mode Avancé</a>
      </div>
    </div>
  </div>

  <footer>
    <img src="af.jpg" class="logo-spin" alt="Logo" onerror="this.style.display='none'">
    <p style="font-size: 0.9rem; opacity: 0.7; letter-spacing: 2px; font-family: 'Orbitron', sans-serif;">
      &copy; 2025 FIOAKEY ⚡ AGBABLI <br>
      <span style="font-size: 0.75rem;">POWERED BY CEET GEOSPATIAL ENGINE</span>
    </p>
  </footer>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // GSAP Setup
    gsap.registerPlugin(ScrollTrigger);

    // State
    let map, marker, accuracyCircle, currentPos = null, watchId = null;
    let globeScene, globeCamera, globeRenderer, earth, globeActive = false;
    let trailPoints = [], radarPulses = [];
    const history = JSON.parse(localStorage.getItem('gpsHistory') || '[]');

    // Proj4 UTM Zones
    const utmZones = {
      '30N': '+proj=utm +zone=30 +datum=WGS84 +units=m +no_defs',
      '31N': '+proj=utm +zone=31 +datum=WGS84 +units=m +no_defs',
      '32N': '+proj=utm +zone=32 +datum=WGS84 +units=m +no_defs'
    };

    // Init
    initCanvas();
    initMap();
    initGlobe();
    loadHistory();
    initAnimations();
    detectTheme();

    // Canvas Constellation
    const canvas = document.getElementById("bgCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];
    let mouse = { x: 0, y: 0 };

    function initCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      particles = [];
      for (let i = 0; i < 120; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.6,
          vy: (Math.random() - 0.5) * 0.6,
          size: Math.random() * 2.5,
          hue: Math.random() * 60 + 180
        });
      }
    }

    function animateCanvas() {
      ctx.fillStyle = 'rgba(5, 8, 16, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        
        // Mouse repulsion
        const dx = mouse.x - p.x;
        const dy = mouse.y - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 100) {
          p.vx -= dx / dist * 0.5;
          p.vy -= dy / dist * 0.5;
        }
        
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
        
        ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, 0.8)`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
          if (dist < 120) {
            ctx.strokeStyle = `hsla(${p.hue}, 100%, 70%, ${1 - dist / 120})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
        }
      });
      requestAnimationFrame(animateCanvas);
    }
    animateCanvas();

    // Leaflet Map
    function initMap(lat = 6.137, lon = 1.215) {
      if (!map) {
        map = L.map("map", { 
          zoomControl: true,
          attributionControl: false 
        }).setView([lat, lon], 13);
        
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19
        }).addTo(map);

        // Custom marker icon
        const pulseIcon = L.divIcon({
          html: `<div style="width: 20px; height: 20px; background: #00f2ff; border-radius: 50%; box-shadow: 0 0 20px #00f2ff; animation: radarPulse 2s infinite;"></div>`,
          className: '',
          iconSize: [20, 20]
        });
        
        marker = L.marker([lat, lon], { icon: pulseIcon }).addTo(map);
      } else {
        gsap.to(map, {
          duration: 2,
          ease: "power2.inOut",
          onUpdate: () => {
            const progress = gsap.getProperty(map, "progress") || 0;
            const currentCenter = map.getCenter();
            const newLat = currentCenter.lat + (lat - currentCenter.lat) * 0.1;
            const newLon = currentCenter.lng + (lon - currentCenter.lng) * 0.1;
            map.setView([newLat, newLon], map.getZoom());
          }
        });
        map.flyTo([lat, lon], 15, { duration: 2 });
        marker.setLatLng([lat, lon]);
      }
    }

    // Three.js Globe
    function initGlobe() {
      const globeCanvas = document.getElementById('globeCanvas');
      globeScene = new THREE.Scene();
      globeCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      globeRenderer = new THREE.WebGLRenderer({ canvas: globeCanvas, alpha: true, antialias: true });
      globeRenderer.setSize(window.innerWidth, window.innerHeight);
      globeRenderer.setPixelRatio(window.devicePixelRatio);

      // Earth
      const geometry = new THREE.SphereGeometry(2, 64, 64);
      const texture = new THREE.TextureLoader().load('https://unpkg.com/three-globe@2.31.1/example/img/earth-blue-marble.jpg');
      const material = new THREE.MeshPhongMaterial({ 
        map: texture,
        bumpScale: 0.05,
        specular: new THREE.Color(0x00f2ff),
        shininess: 10
      });
      earth = new THREE.Mesh(geometry, material);
      globeScene.add(earth);

      // Atmosphere
      const atmGeometry = new THREE.SphereGeometry(2.2, 64, 64);
      const atmMaterial = new THREE.MeshPhongMaterial({
        color: 0x00f2ff,
        transparent: true,
        opacity: 0.1,
        side: THREE.BackSide
      });
      const atmosphere = new THREE.Mesh(atmGeometry, atmMaterial);
      globeScene.add(atmosphere);

      // Lights
      const ambientLight = new THREE.AmbientLight(0x404040, 2);
      globeScene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
      dirLight.position.set(5, 3, 5);
      globeScene.add(dirLight);

      globeCamera.position.z = 6;

      // Controls
      const controls = new OrbitControls(globeCamera, globeRenderer.domElement);
      controls.enableDamping = true;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.5;

      function animateGlobe() {
        if (globeActive) {
          requestAnimationFrame(animateGlobe);
          controls.update();
          globeRenderer.render(globeScene, globeCamera);
        }
      }
      animateGlobe();
    }

    // GPS Functions
    document.getElementById('btnLocation').addEventListener('click', getLocation);
    document.getElementById('btnWatch').addEventListener('click', toggleWatch);
    document.getElementById('btnConvert').addEventListener('click', convertUTM);
    document.getElementById('btnExport').addEventListener('click', exportKML);
    document.getElementById('btnDrawArc').addEventListener('click', drawArc);
    document.getElementById('btnGridUTM').addEventListener('click', toggleUTMGrid);
    document.getElementById('toggleGlobe').addEventListener('click', toggleGlobe);
    document.getElementById('toggleTheme').addEventListener('click', toggleTheme);

    function getLocation() {
      const btn = document.getElementById('btnLocation');
      btn.innerHTML = '<span>Scan en cours</span><span class="loader"></span>';
      btn.disabled = true;

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            btn.innerHTML = '<span>Scanner ma Position</span>';
            btn.disabled = false;
            showPosition(pos);
            showToast('Position acquise avec succès', 'success');
          }, 
          (err) => {
            btn.innerHTML = '<span>Scanner ma Position</span>';
            btn.disabled = false;
            showError(err);
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } else {
        showToast('Géolocalisation non supportée', 'error');
      }
    }

    function showPosition(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const acc = position.coords.accuracy;
      
      currentPos = { lat, lon, acc, timestamp: Date.now() };
      
      // Auto detect UTM zone
      const zone = Math.floor((lon + 180) / 6) + 1;
      const utmDef = `+proj=utm +zone=${zone} +datum=WGS84 +units=m +no_defs`;
      const [easting, northing] = proj4("WGS84", utmDef, [lon, lat]);
      
      // Update UI
      const resDiv = document.getElementById("result");
      resDiv.style.display = "block";
      resDiv.innerHTML = `
        <strong>LAT:</strong> ${lat.toFixed(6)}° | <strong>LON:</strong> ${lon.toFixed(6)}°<br>
        <strong>UTM Zone ${zone}N:</strong><br>
        <strong>EAST:</strong> ${easting.toFixed(2)} m | <strong>NORTH:</strong> ${northing.toFixed(2)} m<br>
        <strong>Précision:</strong> ±${acc.toFixed(0)}m<br>
        <a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}" target="_blank" style="color:var(--primary); text-decoration:none;">↗ Ouvrir dans Google Maps</a>
      `;
      
      gsap.from(resDiv, { opacity: 0, y: 20, duration: 0.5 });

      // Update map with accuracy circle
      initMap(lat, lon);
      if (accuracyCircle) map.removeLayer(accuracyCircle);
      accuracyCircle = L.circle([lat, lon], {
        radius: acc,
        className: 'accuracy-circle',
        color: '#00f2ff',
        fillColor: '#00f2ff',
        fillOpacity: 0.15,
        weight: 2
      }).addTo(map);

      // Radar pulse effect
      createRadarPulse(lat, lon);
      
      // Save to history
      addToHistory(currentPos);
      
      // Update compass
      updateCompass();
    }

    function createRadarPulse(lat, lon) {
      const pulse = L.circle([lat, lon], {
        radius: 0,
        color: '#00f2ff',
        fillColor: '#00f2ff',
        fillOpacity: 0.3,
        weight: 2
      }).addTo(map);
      
      let radius = 0;
      const interval = setInterval(() => {
        radius += 50;
        pulse.setRadius(radius);
        pulse.setStyle({ opacity: 1 - radius / 2000 });
        if (radius > 2000) {
          map.removeLayer(pulse);
          clearInterval(interval);
        }
      }, 50);
    }

    function toggleWatch() {
      const btn = document.getElementById('btnWatch');
      if (watchId === null) {
        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            showPosition(pos);
            addTrailPoint(pos.coords.latitude, pos.coords.longitude);
          },
          showError,
          { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
        );
        btn.textContent = '⏹ Arrêter Suivi';
        btn.style.background = 'var(--accent)';
        showToast('Suivi GPS activé', 'success');
      } else {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        btn.textContent = '📍 Suivi Live';
        btn.style        trailPoints = [];
        showToast('Suivi GPS arrêté', 'success');
      }
    }

    function addTrailPoint(lat, lon) {
      trailPoints.push([lat, lon]);
      if (trailPoints.length > 1) {
        const polyline = L.polyline(trailPoints, {
          color: '#ff0080',
          weight: 3,
          opacity: 0.7,
          smoothFactor: 1
        }).addTo(map);

        // Glow effect
        const glowLine = L.polyline(trailPoints, {
          color: '#ff0080',
          weight: 8,
          opacity: 0.2,
          smoothFactor: 1
        }).addTo(map);
      }
    }

    // Conversion UTM
    function convertUTM() {
      const easting = parseFloat(document.getElementById("easting").value);
      const northing = parseFloat(document.getElementById("northing").value);
      const zoneSelect = document.getElementById("utmZone").value;

      if (isNaN(easting) || isNaN(northing)) {
        showToast('Entrez des valeurs UTM valides', 'error');
        return;
      }

      let utmDef;
      if (zoneSelect === 'auto') {
        // Estimation zone depuis easting - approximatif pour 31N Togo
        utmDef = utmZones['31N'];
        showToast('Zone 31N utilisée par défaut', 'success');
      } else {
        utmDef = utmZones[zoneSelect];
      }

      try {
        const [lon, lat] = proj4(utmDef, "WGS84", [easting, northing]);
        const resDiv = document.getElementById("utmResult");
        resDiv.style.display = "block";
        resDiv.innerHTML = `
          <strong>Latitude :</strong> ${lat.toFixed(6)}°<br>
          <strong>Longitude :</strong> ${lon.toFixed(6)}°<br>
          <strong>Zone UTM:</strong> ${zoneSelect === 'auto'? '31N (auto)' : zoneSelect}<br>
          <a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}" target="_blank" style="color:var(--primary); text-decoration:none;">↗ Itinéraire Google Maps</a>
        `;

        gsap.from(resDiv, { opacity: 0, scale: 0.9, duration: 0.5, ease: "back.out" });
        initMap(lat, lon);
        createRadarPulse(lat, lon);
      } catch (e) {
        showToast('Erreur de conversion UTM', 'error');
      }
    }

    // Tracer Arc entre position actuelle et point UTM
    let arcLayer = null;
    function drawArc() {
      if (!currentPos) {
        showToast('Scanne d\'abord ta position GPS', 'error');
        return;
      }

      const easting = parseFloat(document.getElementById("easting").value);
      const northing = parseFloat(document.getElementById("northing").value);

      if (isNaN(easting) || isNaN(northing)) {
        showToast('Entre les coordonnées UTM d\'abord', 'error');
        return;
      }

      const [lon2, lat2] = proj4(utmZones['31N'], "WGS84", [easting, northing]);

      // Arc Bézier animé
      if (arcLayer) map.removeLayer(arcLayer);

      const latlngs = [];
      const steps = 50;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const lat = currentPos.lat + (lat2 - currentPos.lat) * t;
        const lon = currentPos.lon + (lon2 - currentPos.lon) * t;
        // Ajout courbure
        const offset = Math.sin(t * Math.PI) * 0.01;
        latlngs.push([lat + offset, lon]);
      }

      arcLayer = L.polyline(latlngs, {
        color: '#7000ff',
        weight: 4,
        opacity: 0.8,
        dashArray: '10, 10',
        className: 'arc-animated'
      }).addTo(map);

      map.fitBounds([[currentPos.lat, currentPos.lon], [lat2, lon2]], { padding: [50, 50] });
      showToast('Arc tracé entre les 2 points', 'success');
    }

    // Grille UTM
    let utmGridLayer = null;
    function toggleUTMGrid() {
      if (utmGridLayer) {
        map.removeLayer(utmGridLayer);
        utmGridLayer = null;
        showToast('Grille UTM masquée', 'success');
        return;
      }

      const bounds = map.getBounds();
      const gridLines = [];
      const step = 1000; // 1km

      // Lignes verticales Easting
      for (let e = Math.floor(bounds.getWest() * 111320 / step) * step; e < bounds.getEast() * 111320; e += step) {
        const lon = e / 111320;
        gridLines.push([[bounds.getSouth(), lon], [bounds.getNorth(), lon]]);
      }

      utmGridLayer = L.layerGroup(gridLines.map(line =>
        L.polyline(line, { color: '#00f2ff', weight: 1, opacity: 0.3 })
      )).addTo(map);

      showToast('Grille UTM 1km affichée', 'success');
    }

    // Globe 3D Toggle
    function toggleGlobe() {
      const globeCanvas = document.getElementById('globeCanvas');
      globeActive =!globeActive;

      gsap.to(globeCanvas, {
        opacity: globeActive? 1 : 0,
        duration: 1,
        ease: "power2.inOut",
        onStart: () => {
          if (globeActive) globeCanvas.style.pointerEvents = 'auto';
        },
        onComplete: () => {
          if (!globeActive) globeCanvas.style.pointerEvents = 'none';
        }
      });

      if (globeActive && currentPos) {
        // Pointer sur globe
        const phi = (90 - currentPos.lat) * (Math.PI / 180);
        const theta = (currentPos.lon + 180) * (Math.PI / 180);
        const x = -2.2 * Math.sin(phi) * Math.cos(theta);
        const y = 2.2 * Math.cos(phi);
        const z = 2.2 * Math.sin(phi) * Math.sin(theta);

        const markerGeo = new THREE.SphereGeometry(0.05, 16, 16);
        const markerMat = new THREE.MeshBasicMaterial({ color: 0xff0080 });
        const markerMesh = new THREE.Mesh(markerGeo, markerMat);
        markerMesh.position.set(x, y, z);
        globeScene.add(markerMesh);
      }

      showToast(globeActive? 'Vue Globe 3D activée' : 'Vue Carte 2D', 'success');
    }

    // Export KML
    function exportKML() {
      if (!currentPos) {
        showToast('Aucune position à exporter', 'error');
        return;
      }

      const kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>Position GPS CEET</name>
    <Placemark>
      <name>Ma Position</name>
      <description>Exporté depuis GPS↔UTM Pro</description>
      <Point>
        <coordinates>${currentPos.lon},${currentPos.lat},0</coordinates>
      </Point>
    </Placemark>
  </Document>
</kml>`;

      const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `position_${Date.now()}.kml`;
      a.click();
      showToast('KML exporté', 'success');
    }

    // Historique
    function addToHistory(pos) {
      history.unshift({
        lat: pos.lat,
        lon: pos.lon,
        acc: pos.acc,
        timestamp: pos.timestamp
      });
      if (history.length > 10) history.pop();
      localStorage.setItem('gpsHistory', JSON.stringify(history));
      loadHistory();
    }

    function loadHistory() {
      const historyDiv = document.getElementById('history');
      historyDiv.innerHTML = history.map((h, i) => `
        <div class="history-item" onclick="loadHistoryPoint(${i})">
          <strong>${new Date(h.timestamp).toLocaleTimeString('fr-FR')}</strong><br>
          ${h.lat.toFixed(5)}, ${h.lon.toFixed(5)} | ±${h.acc.toFixed(0)}m
        </div>
      `).join('');
    }

    window.loadHistoryPoint = function(index) {
      const h = history[index];
      currentPos = h;
      initMap(h.lat, h.lon);
      createRadarPulse(h.lat, h.lon);
      showToast('Position historique chargée', 'success');
    }

    // Compass
    function updateCompass() {
      if ('DeviceOrientationEvent' in window) {
        window.addEventListener('deviceorientation', (e) => {
          const needle = document.getElementById('compass-needle');
          gsap.to(needle, { rotation: 360 - e.alpha, duration: 0.3 });
        });
      } else {
        // Idle rotation
        gsap.to('#compass-needle', {
          rotation: 360,
          duration: 20,
          repeat: -1,
          ease: "none"
        });
      }
    }

    // Thème jour/nuit auto
    function detectTheme() {
      const hour = new Date().getHours();
      const isNight = hour < 6 || hour > 18;
      document.body.classList.toggle('night-mode', isNight);
      document.getElementById('toggleTheme').textContent = isNight? '☀️' : '🌙';
    }

    function toggleTheme() {
      document.body.classList.toggle('night-mode');
      const isNight = document.body.classList.contains('night-mode');
      document.getElementById('toggleTheme').textContent = isNight? '☀️' : '🌙';
    }

    // Toast Notifications
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = message;
      document.body.appendChild(toast);

      gsap.to(toast, { x: 0, duration: 0.5, ease: "back.out" });
      gsap.to(toast, {
        x: 400,
        duration: 0.5,
        delay: 3,
        ease: "back.in",
        onComplete: () => toast.remove()
      });
    }

    function showError(error) {
      let msg = 'Erreur GPS inconnue';
      switch(error.code) {
        case error.PERMISSION_DENIED: msg = 'Permission GPS refusée'; break;
        case error.POSITION_UNAVAILABLE: msg = 'Position indisponible'; break;
        case error.TIMEOUT: msg = 'Timeout GPS'; break;
      }
      showToast(msg, 'error');
    }

    // Animations GSAP au load
    function initAnimations() {
      gsap.from('.glass-card', {
        duration: 1,
        y: 100,
        opacity: 0,
        rotationX: 15,
        stagger: 0.2,
        ease: "power3.out"
      });

      gsap.from('header', {
        duration: 0.8,
        y: -100,
        ease: "power3.out"
      });

      // Parallax sur scroll
      gsap.to('.logo-text', {
        scrollTrigger: {
          trigger: '.container',
          start: 'top top',
          scrub: 1
        },
        y: 50,
        opacity: 0.5
      });
    }

    // Mouse tracking pour canvas
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('resize', () => {
      initCanvas();
      if (globeRenderer) {
        globeCamera.aspect = window.innerWidth / window.innerHeight;
        globeCamera.updateProjectionMatrix();
        globeRenderer.setSize(window.innerWidth, window.innerHeight);
      }
    });

    // Service Worker pour PWA - optionnel
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

  </script>
</body>
</html>
